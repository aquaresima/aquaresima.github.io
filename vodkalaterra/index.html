                                                                                                                                                            <!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="style/styles.css">
        <link rel="stylesheet" href="style/inputs.css">

        <script src="js/jquery-3.6.0.min.js"></script>
        <script src="js/jquery-ui.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.12.0/build/ol.js"></script>
        <script src="js/weighted_list.min.js"></script>
        <script src="js/p5.min.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/dynamics.js"></script>

    <title>Hello, world!</title>
  </head>
  <body>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <p class="title">Population dynamics</p>
    <div class="page">
        <div class="blocks">
            <div class="inputs">
                <div class="item">
                <h4> Valori iniziali</h4>
                    <div id="initial_values">
                        <p>
                            <label >Volpi iniziali</label>
                            <input type="range" id="ratio" min="0" max="100">
                        </p>
                        <p>
                            <label>Velocità</label>
                            <input type="range" id="speed" min="0" max="100">
                        </p>
                       <p>
                            <label >Dimensione</label>
                            <input type="range" id="size" min="0" max="100">
                        </p>
                    </div>
                </div>
                <div class="item">
                    <h4> Tasso di riproduzione</h4>
                        <div id="r_values">
                            <p>
                                <label >Volpi</label>
                                <input type="range" id="r_fox" min="0" max="100">
                            </p>
                            <p>
                                <label >Conigli</label>
                                <input type="range" id="r_rabbit" min="0" max="100">
                            </p>
                            <p>
                                <label >Conigli</label>
                                <input type="range" id="r_grass" min="0" max="100">
                            </p>
                        </div>
                </div>
            </div>
            
            <button class="item" id="restart_button" type="submit"> Restart </button>
        </div>
        <div class="blocks">    
        </div>
    </div>
        <div id="sketch_box"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/main.js"> </script>
  </body>
</html>
